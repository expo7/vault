[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-credential-vault"
version = "0.1.0"
description = "A small encrypted local credential vault CLI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["cryptography>=41.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vault = "vault.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
